{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <title>{% block title %}ОТ Донер{% endblock %}</title>
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'icons/icon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">ОТ</span> Донер</div>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="link">Выйти</button>
      </form>
    {% endif %}
  </header>
  <main class="page">
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-ok{% elif message.tags == 'warning' %}alert-warn{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
