{# Сколько часов: кнопки 1/2/3 или своё число. Нужны: hour_choices, pick (префикс id), employee. #}
<div class="field-label">Сколько часов</div>
<div class="segmented hours">
  {% for h in hour_choices %}<label><input type="radio" name="hours" value="{{ h }}" {% if forloop.first %}checked{% endif %}><span>{{ h }} ч</span></label>{% endfor %}
</div>
<label class="field-label" for="hours-{{ pick }}-{{ employee.id }}">Или другое число часов</label>
<input type="number" id="hours-{{ pick }}-{{ employee.id }}" name="hours_other" min="1" max="12" step="1" inputmode="numeric" placeholder="Например: 5">
