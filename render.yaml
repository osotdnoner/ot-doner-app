# Тестовая онлайн-версия на бесплатном хостинге Render (render.com).
# Запуск в один клик: https://render.com/deploy?repo=https://github.com/osotdnoner/ot-doner-app
# Это только для проверки: бесплатный сервер засыпает после 15 минут без посетителей,
# а фото пропадают при перезапуске. Для работы точек нужен сервер в Казахстане.
services:
  - type: web
    name: ot-doner-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py demo_setup --if-empty && python manage.py setup_branches --with-demo-users && (python manage.py sync_sheet || true) && gunicorn config.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SERVE_MEDIA
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: ot-doner-db
          property: connectionString

databases:
  - name: ot-doner-db
    plan: free
    region: frankfurt
